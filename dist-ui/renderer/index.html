<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:3000;">
  <title>MiniOpenCode</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f7f6f3;
      --bg-tertiary: #f1f1ef;
      --border-color: #e9e9e7;
      --text-primary: #37352f;
      --text-secondary: #787774;
      --text-tertiary: #9b9a97;
      --accent-color: #2383e2;
      --accent-hover: #1d6dbe;
      --hover-bg: rgba(55, 53, 47, 0.08);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.1);
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
    }
    
    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    
    .header {
      background: var(--bg-primary);
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    
    .header-info {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    
    .sidebar-header {
      padding: 12px 14px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }
    
    .session-list::-webkit-scrollbar {
      width: 6px;
    }
    
    .session-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }
    
    .session-item {
      padding: 8px 10px;
      cursor: pointer;
      border-radius: var(--radius-md);
      font-size: 13px;
      color: var(--text-primary);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s ease;
    }
    
    .session-item:hover {
      background: var(--hover-bg);
    }
    
    .session-item.active {
      background: var(--bg-tertiary);
    }
    
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
    }
    
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
    }
    
    .messages::-webkit-scrollbar {
      width: 8px;
    }
    
    .messages::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }
    
    .message {
      margin-bottom: 24px;
      max-width: 680px;
      animation: fadeIn 0.2s ease;
    }
    
    .message.user {
      padding-left: 60px;
    }
    
    .message.assistant {
      padding-right: 60px;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .message.user {
      margin-left: auto;
      margin-right: 0;
    }
    
    .message.assistant {
      margin-right: auto;
    }
    
    .message-content {
      padding: 12px 14px;
      border-radius: var(--radius-lg);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    
    .message.user .message-content {
      background: transparent;
      color: var(--text-primary);
      padding-left: 0;
      padding-right: 0;
    }
    
    .message.assistant .message-content {
      background: transparent;
      padding-left: 0;
      padding-right: 0;
    }
    
    .message-role {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-bottom: 4px;
      padding-left: 14px;
    }
    
    .message.user .message-role {
      text-align: right;
      padding-right: 14px;
      padding-left: 0;
    }
    
    .typing-indicator {
      display: inline-flex;
      gap: 4px;
      padding: 4px 0;
      vertical-align: middle;
    }
    
    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: var(--text-tertiary);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    
    .thinking {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-tertiary);
      font-size: 13px;
    }
    
    .text-content {
      white-space: pre-wrap;
    }
    
    .input-area {
      padding: 16px 20px;
      background: var(--bg-primary);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }
    
    .input-area textarea {
      flex: 1;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    
    .input-area textarea:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(35, 131, 226, 0.15);
    }
    
    .input-area textarea::placeholder {
      color: var(--text-tertiary);
    }
    
    .input-area button {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: var(--radius-lg);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      align-self: flex-end;
      min-height: 44px;
    }
    
    .input-area button:hover {
      background: var(--accent-hover);
    }
    
    .input-area button:active {
      transform: scale(0.98);
    }
    
    .input-area button:disabled {
      background: var(--bg-tertiary);
      color: var(--text-tertiary);
      cursor: not-allowed;
    }
    
    /* Markdown styles */
    .message-content code {
      background: rgba(0, 0, 0, 0.06);
      padding: 2px 5px;
      border-radius: 3px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      font-size: 0.9em;
    }
    
    .message.user .message-content code {
      background: rgba(255, 255, 255, 0.15);
    }
    
    .message-content pre {
      background: var(--bg-tertiary);
      padding: 12px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin: 8px 0;
    }
    
    .message-content pre code {
      background: none;
      padding: 0;
    }
    
    .message-content a {
      color: var(--accent-color);
      text-decoration: none;
    }
    
    .message-content a:hover {
      text-decoration: underline;
    }
    
    .message-content ul, .message-content ol {
      margin: 8px 0;
      padding-left: 20px;
    }
    
    .message-content li {
      margin: 4px 0;
    }
    
    .message-content strong {
      font-weight: 600;
    }
    
    .message-content blockquote {
      border-left: 3px solid var(--border-color);
      padding-left: 12px;
      margin: 8px 0;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>MiniOpenCode</h1>
    <div class="header-info">
      <span id="platform">-</span> | <span id="version">-</span>
    </div>
  </div>
  
  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">会话列表</div>
      <div class="session-list" id="sessionList">
        <div class="session-item active">新会话</div>
      </div>
    </div>
    
    <div class="chat-area">
      <div class="messages" id="messages">
        <div class="message assistant">
          <div class="message-role">Assistant</div>
          <div class="message-content">你好！我是 MiniOpenCode 助手。有什么可以帮助你的吗？</div>
        </div>
      </div>
      
      <div class="input-area">
        <textarea id="input" placeholder="输入消息..." rows="1"></textarea>
        <button id="sendBtn">发送</button>
      </div>
    </div>
  </div>

  <script type="module" src="renderer.js"></script>
</body>
</html>
