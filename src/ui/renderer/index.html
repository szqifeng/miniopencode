<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>MiniOpenCode</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #16213e;
      padding: 12px 20px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      font-size: 18px;
      color: #00d9ff;
    }
    .header-info {
      font-size: 12px;
      color: #888;
    }
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .sidebar {
      width: 250px;
      background: #16213e;
      border-right: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid #0f3460;
      font-size: 14px;
      color: #00d9ff;
    }
    .session-list {
      flex: 1;
      overflow-y: auto;
    }
    .session-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid #0f3460;
      font-size: 13px;
    }
    .session-item:hover {
      background: #1a1a2e;
    }
    .session-item.active {
      background: #0f3460;
      color: #00d9ff;
    }
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .message {
      margin-bottom: 16px;
      max-width: 80%;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      margin-left: auto;
      background: #0f3460;
      padding: 10px 14px;
      border-radius: 12px 12px 0 12px;
    }
    .message.assistant {
      background: #16213e;
      padding: 10px 14px;
      border-radius: 12px 12px 12px 0;
    }
    .message-role {
      font-size: 11px;
      color: #00d9ff;
      margin-bottom: 4px;
    }
    .message-content {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .typing-indicator {
      display: inline-flex;
      gap: 4px;
      padding: 4px 0;
    }
    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #00d9ff;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .thinking {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .thinking-text {
      color: #888;
      font-size: 13px;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .text-content {
      white-space: pre-wrap;
    }
    .input-area {
      padding: 16px 20px;
      background: #16213e;
      border-top: 1px solid #0f3460;
      display: flex;
      gap: 12px;
    }
    .input-area textarea {
      flex: 1;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 10px 14px;
      color: #eee;
      font-size: 14px;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      font-family: inherit;
    }
    .input-area textarea:focus {
      outline: none;
      border-color: #00d9ff;
    }
    .input-area button {
      background: #00d9ff;
      color: #1a1a2e;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .input-area button:hover {
      background: #00b8d9;
    }
    .input-area button:disabled {
      background: #555;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>MiniOpenCode</h1>
    <div class="header-info">
      <span id="platform">-</span> | <span id="version">-</span>
    </div>
  </div>
  
  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">会话列表</div>
      <div class="session-list" id="sessionList">
        <div class="session-item active">新会话</div>
      </div>
    </div>
    
    <div class="chat-area">
      <div class="messages" id="messages">
        <div class="message assistant">
          <div class="message-role">Assistant</div>
          <div class="message-content">你好！我是 MiniOpenCode 助手。有什么可以帮助你的吗？</div>
        </div>
      </div>
      
      <div class="input-area">
        <textarea id="input" placeholder="输入消息..." rows="1"></textarea>
        <button id="sendBtn">发送</button>
      </div>
    </div>
  </div>

  <script type="module" src="renderer.js"></script>
</body>
</html>
